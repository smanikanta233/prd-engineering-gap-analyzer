openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: PRD Engineering Gap Analyzer API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analyses
    description: PRD analysis operations
  - name: gaps
    description: Gap feedback operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /health:
    get:
      operationId: healthCheckAlt
      tags: [health]
      summary: Health check (alternate path)
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /analyses:
    get:
      operationId: listAnalyses
      tags: [analyses]
      summary: List all analyses
      responses:
        "200":
          description: List of analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalysisSummary"
    post:
      operationId: createAnalysis
      tags: [analyses]
      summary: Create a new PRD analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisInput"
      responses:
        "201":
          description: Analysis created with gaps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "400":
          description: Invalid input

  /analyses/summary:
    get:
      operationId: getAnalysesSummary
      tags: [analyses]
      summary: Get aggregate summary stats
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysesSummary"

  /analyses/{id}:
    get:
      operationId: getAnalysis
      tags: [analyses]
      summary: Get a single analysis with all gaps
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analysis with gaps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "404":
          description: Not found
    delete:
      operationId: deleteAnalysis
      tags: [analyses]
      summary: Delete an analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /gaps/{id}/feedback:
    post:
      operationId: submitGapFeedback
      tags: [gaps]
      summary: Submit feedback for a gap
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "201":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
        "404":
          description: Gap not found

components:
  schemas:
    HealthStatus:
      type: object
      required: [status, message, timestamp]
      properties:
        status:
          type: string
        message:
          type: string
        timestamp:
          type: string

    EngineConfidence:
      type: object
      required: [structureScore, clarityScore, completenessScore, totalScore, grade, interpretation]
      properties:
        structureScore:
          type: number
        clarityScore:
          type: number
        completenessScore:
          type: number
        totalScore:
          type: number
        grade:
          type: string
        interpretation:
          type: string

    EngineSections:
      type: object
      required: [totalDetected, totalExpected, completenessPercent, missingSections, problemStatement, goal, scope, acceptanceCriteria, assumptions, edgeCases, dependencies, errorHandling]
      properties:
        totalDetected:
          type: integer
        totalExpected:
          type: integer
        completenessPercent:
          type: number
        missingSections:
          type: array
          items:
            type: string
        problemStatement:
          type: boolean
        goal:
          type: boolean
        scope:
          type: boolean
        acceptanceCriteria:
          type: boolean
        assumptions:
          type: boolean
        edgeCases:
          type: boolean
        dependencies:
          type: boolean
        errorHandling:
          type: boolean

    EngineSummary:
      type: object
      required: [totalIssuesFound, criticalCount, highCount, mediumCount, lowCount, topIssues, readinessLabel]
      properties:
        totalIssuesFound:
          type: integer
        criticalCount:
          type: integer
        highCount:
          type: integer
        mediumCount:
          type: integer
        lowCount:
          type: integer
        topIssues:
          type: array
          items:
            type: string
        readinessLabel:
          type: string

    EngineReport:
      type: object
      required: [confidence, sections, summary, processingTimeMs]
      properties:
        confidence:
          $ref: "#/components/schemas/EngineConfidence"
        sections:
          $ref: "#/components/schemas/EngineSections"
        summary:
          $ref: "#/components/schemas/EngineSummary"
        processingTimeMs:
          type: number

    Gap:
      type: object
      required: [id, analysisId, gapType, description, severity, confidence, createdAt, helpfulCount, notHelpfulCount]
      properties:
        id:
          type: integer
        analysisId:
          type: integer
        gapType:
          type: string
        description:
          type: string
        severity:
          type: string
        confidence:
          type: number
        source:
          type: string
        recommendation:
          type: string
          nullable: true
        createdAt:
          type: string
        helpfulCount:
          type: integer
        notHelpfulCount:
          type: integer

    Analysis:
      type: object
      required: [id, prdText, title, createdAt, gaps]
      properties:
        id:
          type: integer
        prdText:
          type: string
        title:
          type: string
        createdAt:
          type: string
        aiSummary:
          type: string
          nullable: true
        engineReport:
          $ref: "#/components/schemas/EngineReport"
          nullable: true
        gaps:
          type: array
          items:
            $ref: "#/components/schemas/Gap"

    AnalysisSummary:
      type: object
      required: [id, title, prdText, createdAt, gapCount, criticalCount, highCount, mediumCount, lowCount]
      properties:
        id:
          type: integer
        title:
          type: string
        prdText:
          type: string
        createdAt:
          type: string
        gapCount:
          type: integer
        criticalCount:
          type: integer
        highCount:
          type: integer
        mediumCount:
          type: integer
        lowCount:
          type: integer

    AnalysisInput:
      type: object
      required: [prdText, title]
      properties:
        prdText:
          type: string
          minLength: 50
        title:
          type: string
          minLength: 3

    GapTypeBreakdown:
      type: object
      required: [gapType, count, avgConfidence, mostCommonSeverity]
      properties:
        gapType:
          type: string
        count:
          type: integer
        avgConfidence:
          type: number
        mostCommonSeverity:
          type: string

    SeverityBreakdown:
      type: object
      required: [severity, count]
      properties:
        severity:
          type: string
        count:
          type: integer

    FeedbackSummaryItem:
      type: object
      required: [gapType, helpfulCount, notHelpfulCount, helpfulnessRate]
      properties:
        gapType:
          type: string
        helpfulCount:
          type: integer
        notHelpfulCount:
          type: integer
        helpfulnessRate:
          type: number

    AnalysesSummary:
      type: object
      required: [totalAnalyses, totalGaps, avgGapsPerAnalysis, avgConfidence, totalFeedback, gapTypeBreakdown, severityBreakdown, feedbackSummary]
      properties:
        totalAnalyses:
          type: integer
        totalGaps:
          type: integer
        avgGapsPerAnalysis:
          type: number
        avgConfidence:
          type: number
        totalFeedback:
          type: integer
        gapTypeBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/GapTypeBreakdown"
        severityBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/SeverityBreakdown"
        feedbackSummary:
          type: array
          items:
            $ref: "#/components/schemas/FeedbackSummaryItem"

    FeedbackInput:
      type: object
      required: [isHelpful]
      properties:
        isHelpful:
          type: boolean

    Feedback:
      type: object
      required: [id, gapId, isHelpful, createdAt]
      properties:
        id:
          type: integer
        gapId:
          type: integer
        isHelpful:
          type: boolean
        createdAt:
          type: string
